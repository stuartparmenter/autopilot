<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Autopilot v2 Architecture — Knowledge Graph</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; }
  svg { width: 100vw; height: 100vh; }
  .legend { position: fixed; top: 16px; right: 16px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px 16px; font-size: 13px; z-index: 10; }
  .legend h3 { margin-bottom: 8px; font-size: 14px; color: #f0f6fc; }
  .legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
  .controls { position: fixed; top: 16px; left: 16px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px 16px; font-size: 13px; z-index: 10; max-height: 90vh; overflow-y: auto; }
  .controls h3 { margin-bottom: 8px; font-size: 14px; color: #f0f6fc; }
  .controls label { display: block; margin: 4px 0; cursor: pointer; }
  .controls input[type=checkbox] { margin-right: 6px; }
  .tooltip { position: fixed; background: #1c2128; border: 1px solid #30363d; border-radius: 6px; padding: 8px 12px; font-size: 12px; pointer-events: none; z-index: 20; max-width: 320px; display: none; }
  .tooltip .tt-name { font-weight: 600; color: #f0f6fc; font-size: 14px; }
  .tooltip .tt-type { color: #8b949e; margin-top: 2px; }
  .tooltip .tt-conf { color: #8b949e; margin-top: 2px; }
  .tooltip .tt-desc { color: #c9d1d9; margin-top: 4px; font-size: 11px; }
  text.node-label { font-size: 11px; fill: #c9d1d9; pointer-events: none; text-anchor: middle; dominant-baseline: central; }
  text.edge-label { font-size: 9px; fill: #484f58; pointer-events: none; text-anchor: middle; }
</style>
</head>
<body>
<div class="controls">
  <h3>Filter Entity Types</h3>
  <div id="type-filters"></div>
  <hr style="border-color:#30363d;margin:8px 0">

  <div id="rel-filters"></div>

  <h3>Entity Types</h3>

  <div class="tt-desc" id="tt-desc"></div>

// ── Build data structures ───────────────────────────────────────────────────

const nameMap = {};
entities.forEach(e => nameMap[e.name] = e);

const links = relationships.map(r => ({
  source: r.s,
  target: r.t,
  type: r.type,
}));

const relTypes = [...new Set(relationships.map(r => r.type))].sort();
const entityTypes = [...new Set(entities.map(e => e.type))].sort();

const activeEntityTypes = new Set(entityTypes);
const activeRelTypes = new Set(relTypes);

// ── Filter controls ─────────────────────────────────────────────────────────

const typeFiltersEl = document.getElementById('type-filters');
entityTypes.forEach(t => {
  const label = document.createElement('label');
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = true;
  cb.addEventListener('change', () => {
    if (cb.checked) activeEntityTypes.add(t);
    else activeEntityTypes.delete(t);
    updateGraph();
  });
  const dot = document.createElement('span');
  dot.style.display = 'inline-block';
  dot.style.width = '10px';
  dot.style.height = '10px';
  dot.style.borderRadius = '50%';
  dot.style.backgroundColor = typeColors[t];
  dot.style.marginRight = '4px';
  label.appendChild(cb);
  label.appendChild(dot);
  label.appendChild(document.createTextNode(' ' + (typeLabels[t] || t)));
  typeFiltersEl.appendChild(label);
});

const relFiltersEl = document.getElementById('rel-filters');
relTypes.forEach(t => {
  const label = document.createElement('label');
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = true;
  cb.addEventListener('change', () => {
    if (cb.checked) activeRelTypes.add(t);
    else activeRelTypes.delete(t);
    updateGraph();
  });
  label.appendChild(cb);
  label.appendChild(document.createTextNode(' ' + t.replace(/_/g, ' ')));
  relFiltersEl.appendChild(label);
});

// Legend
const legendEl = document.getElementById('legend-items');
entityTypes.forEach(t => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  const dot = document.createElement('div');
  dot.className = 'legend-dot';
  dot.style.backgroundColor = typeColors[t];
  item.appendChild(dot);
  const count = entities.filter(e => e.type === t).length;
  item.appendChild(document.createTextNode((typeLabels[t] || t) + ' (' + count + ')'));
  legendEl.appendChild(item);
});

// ── SVG setup ───────────────────────────────────────────────────────────────

const svg = d3.select('#graph');
const width = window.innerWidth;
const height = window.innerHeight;

const g = svg.append('g');

const zoom = d3.zoom()
  .scaleExtent([0.1, 4])
  .on('zoom', (event) => g.attr('transform', event.transform));
svg.call(zoom);

// Arrow markers
const defs = svg.append('defs');
Object.entries(relTypeColors).forEach(([type, color]) => {
  defs.append('marker')
    .attr('id', 'arrow-' + type)
    .attr('viewBox', '0 -5 10 10')
    .attr('refX', 20)
    .attr('refY', 0)
    .attr('markerWidth', 6)
    .attr('markerHeight', 6)
    .attr('orient', 'auto')
    .append('path')
    .attr('d', 'M0,-5L10,0L0,5')
    .attr('fill', color)
    .attr('opacity', 0.7);
});

// ── Force simulation ────────────────────────────────────────────────────────

let simulation;
let linkSel, nodeSel, labelSel, edgeLabelSel;

function nodeRadius(e) {
  const r = { stage: 18, role: 16, system: 14, artifact: 12, condition: 11, decision_point: 11, pattern: 10, skill: 10 };
  return r[e.type] || 12;
}

function updateGraph() {
  const visibleEntities = entities.filter(e => activeEntityTypes.has(e.type));
  const visibleNames = new Set(visibleEntities.map(e => e.name));
  const visibleLinks = links.filter(l =>
    activeRelTypes.has(l.type) && visibleNames.has(l.source.name || l.source) && visibleNames.has(l.target.name || l.target)
  );

  if (simulation) simulation.stop();

  const nodes = visibleEntities.map(e => ({...e}));
  const nodeMap = {};
  nodes.forEach(n => nodeMap[n.name] = n);

  const edgeData = visibleLinks.map(l => ({
    source: nodeMap[l.source.name || l.source],
    target: nodeMap[l.target.name || l.target],
    type: l.type,
  })).filter(l => l.source && l.target);

  g.selectAll('*').remove();

  linkSel = g.append('g').selectAll('line')
    .data(edgeData)
    .join('line')
    .attr('stroke', d => relTypeColors[d.type] || '#30363d')
    .attr('stroke-width', d => {
      if (d.type === 'TRANSITIONS_TO') return 2.5;
      if (d.type === 'MANAGES' || d.type === 'SPAWNS') return 2;
      return 1.2;
    })
    .attr('stroke-opacity', d => d.type === 'TRANSITIONS_TO' ? 0.8 : 0.4)
    .attr('stroke-dasharray', d => d.type === 'SPAWNS' ? '4,3' : null)
    .attr('marker-end', d => 'url(#arrow-' + d.type + ')');

  edgeLabelSel = g.append('g').selectAll('text')
    .data(edgeData)
    .join('text')
    .attr('class', 'edge-label')
    .text(d => d.type.replace(/_/g, ' '))
    .attr('fill', d => relTypeColors[d.type] || '#484f58')
    .attr('opacity', 0.6);

  nodeSel = g.append('g').selectAll('g')
    .data(nodes, d => d.name)
    .join('g')
    .call(d3.drag()
      .on('start', dragstarted)
      .on('drag', dragged)
      .on('end', dragended))
    .on('mouseover', (event, d) => {
      tooltipEl.style.display = 'block';
      ttName.textContent = d.name;
      ttType.textContent = typeLabels[d.type] || d.type;
      ttConf.textContent = 'Confidence: ' + d.confidence;
      ttDesc.textContent = d.desc || '';
    })
    .on('mousemove', (event) => {
      tooltipEl.style.left = (event.clientX + 12) + 'px';
      tooltipEl.style.top = (event.clientY - 8) + 'px';
    })
    .on('mouseout', () => { tooltipEl.style.display = 'none'; });

  nodeSel.append('circle')
    .attr('r', d => nodeRadius(d))
    .attr('fill', d => typeColors[d.type] || '#30363d')
    .attr('opacity', d => Math.max(0.4, d.confidence))
    .attr('stroke', '#0d1117')
    .attr('stroke-width', 1.5);

  nodeSel.append('text')
    .attr('class', 'node-label')
    .attr('dy', d => nodeRadius(d) + 14)
    .text(d => d.name.length > 22 ? d.name.slice(0, 20) + '...' : d.name);

  simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(edgeData).id(d => d.name).distance(d => {
      if (d.type === 'TRANSITIONS_TO') return 100;
      if (d.type === 'MANAGES' || d.type === 'SPAWNS') return 120;
      return 140;
    }))
    .force('charge', d3.forceManyBody().strength(-400))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide().radius(d => nodeRadius(d) + 20))
    .force('x', d3.forceX(width / 2).strength(0.03))
    .force('y', d3.forceY(height / 2).strength(0.03))
    .on('tick', ticked);
}

function ticked() {
  linkSel
    .attr('x1', d => d.source.x)
    .attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x)
    .attr('y2', d => d.target.y);

  edgeLabelSel
    .attr('x', d => (d.source.x + d.target.x) / 2)
    .attr('y', d => (d.source.y + d.target.y) / 2);

  nodeSel.attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');
}

function dragstarted(event, d) {
  if (!event.active) simulation.alphaTarget(0.3).restart();
  d.fx = d.x;
  d.fy = d.y;
}

function dragged(event, d) {
  d.fx = event.x;
  d.fy = event.y;
}

function dragended(event, d) {
  if (!event.active) simulation.alphaTarget(0);
  d.fx = null;
  d.fy = null;
}

updateGraph();
svg.call(zoom.transform, d3.zoomIdentity.translate(0, 0).scale(0.85));
</script>
</body>
</html>
